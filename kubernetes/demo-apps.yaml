# ── Demo PostgreSQL ───────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-postgres
  namespace: production
  labels:
    app: demo-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-postgres
  template:
    metadata:
      labels:
        app: demo-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: "demo"
            - name: POSTGRES_PASSWORD
              value: "demo_secret"
            - name: POSTGRES_DB
              value: "demo"
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-postgres
  namespace: production
spec:
  selector:
    app: demo-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# ── Demo Redis ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-redis
  namespace: production
  labels:
    app: demo-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-redis
  template:
    metadata:
      labels:
        app: demo-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-redis
  namespace: production
spec:
  selector:
    app: demo-redis
  ports:
    - port: 6379
      targetPort: 6379
---
# ── Payment Service ───────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: production
  labels:
    app: payment
    app.kubernetes.io/name: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: payment
          image: payment-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3002"
            - name: DATABASE_URL
              value: "postgresql://demo:demo_secret@demo-postgres:5432/demo"
            - name: DB_POOL_SIZE
              value: "10"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.aegis-system:4317"
          ports:
            - containerPort: 3002
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: production
spec:
  selector:
    app: payment
  ports:
    - port: 3002
      targetPort: 3002
      name: http
---
